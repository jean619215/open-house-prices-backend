services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: realestate
    ports:
      # Host 5434 → 容器 5432，避開本機 postgres(5432) 與 pf-postgres(5433)，見 README
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d realestate"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 → 容器 6379，避開其他專案容器（pf-redis）佔用的 6379，見 README
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
