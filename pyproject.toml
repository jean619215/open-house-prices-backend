[project]
name = "open-house-prices-backend"
version = "0.1.0"
description = "台灣房地產實價登錄資料 API 後端服務"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.137.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "redis[asyncio]>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "etl", "ml", "shared"]
